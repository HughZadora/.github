name: Bug report
description: Report a reproducible problem or unexpected behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough information to reproduce and understand it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, version, browser, deployment, or configuration information.
      placeholder: Add only details relevant to the problem.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add logs, screenshots, links, or other useful context. Remove secrets and sensitive information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same problem.
          required: true
        - label: I removed secrets, credentials, and sensitive information from the report.
          required: true
